version: "3.9"

services:
  omnimind-ai:
    container_name: omnimind-ai

    build:
      context: .
      dockerfile: Dockerfile

    image: omnimind-ai:latest

    restart: unless-stopped

    ports:
      - "8501:8501"

    env_file:
      - .env

    volumes:
      - ./database:/app/database
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./logs:/app/logs

    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false

    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - omnimind-network

networks:
  omnimind-network:
    driver: bridge

